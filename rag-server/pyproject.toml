[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codesec-rag-server"
version = "0.1.0"
description = "Internal OWASP RAG retrieval and embedding microservice with Qdrant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=3.0.0",
    "redis>=5.0.0",
    "requests>=2.32.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
